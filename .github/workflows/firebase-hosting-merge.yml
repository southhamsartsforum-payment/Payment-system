name: Deploy Visitor Counter to Firebase Hosting

on:
  push:
    branches:
      - Visitors

concurrency:
  group: firebase-deploy-visitor
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deploy ONLY the Counter App
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHAF_PAYMENT_SYSTEM }}
          projectId: shaf-payment-system
          target: shafcounter
          channelId: live
          entryPoint: ./Visitor_Counter